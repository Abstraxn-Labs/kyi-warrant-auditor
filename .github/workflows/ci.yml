name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Install + verify sample receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify sample receipt
        env:
          ONCHAIN: '0'
          PUBLIC_KEY_FILE: ./examples/warrant-public-key.hex
        run: npm run verify -- ./examples/sample-receipt.json

      - name: Tamper demo must reject forged amount
        env:
          ONCHAIN: '0'
          PUBLIC_KEY_FILE: ./examples/warrant-public-key.hex
        run: npm run verify -- ./examples/sample-receipt.json --tamper

      - name: Build web
        run: npm run build:web

      - name: Typecheck
        run: npm run typecheck
